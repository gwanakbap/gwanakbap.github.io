<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>과낙ON</title>
    <link rel="icon" href="/gwanakon/gwanakonIcon.png" />
    <link rel="manifest" href="/gwanakon/manifest.json">
    <link rel="stylesheet" href="./style.css" type="text/css">
</head>
<body>

<div id="app-container">
    <header id="app-header">당직상황근무지정</header>

    <div class="swipe-viewport" id="viewport">
        <div class="swipe-track" id="track">
            
            <!-- 페이지 0: 달력 -->
            <section class="view-page calendar-page">
                <div class="card calendar-card">
                    <div class="calendar-nav">
                        <h2 class="cal-title" id="calendar-title">달력</h2>
                    </div>
                    <div class="calendar-grid" id="calendar-grid"></div>
                </div>
            </section>

            <!-- 페이지 1: 근무 카드 -->
            <section class="view-page">
                <div class="card" id="today-card"></div>

                <!-- 아이디(next-duty-card) 추가 및 내부 비우기 (JS에서 동적 렌더링) -->
                <div class="card next-duty" id="next-duty-card"></div>
            </section>

            <!-- 페이지 2: 설정 -->
            <section class="view-page">
                <div class="card">        
                    <div class="setting-item setting-group">
                        <div class="setting-row">
                            <span>사용자 이름</span>
                            <div class="input-with-btn">
                                <input type="text" id="username-input" class="setting-input" value="" placeholder="이름 입력">
                                <button type="button" id="btn-save-username" class="btn-save">저장</button>
                            </div>
                        </div>
                        <p class="setting-notice">※ 이름을 설정하시면 캘린더 강조 및 다음 당직 안내 대상에 포함됩니다.</p>
                        <div id="save-feedback" class="feedback-msg">✓ 저장되었습니다.</div>
                    </div>

                    <div class="setting-item">
                        <span>하루 전 당직 알림 받기</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="notification-toggle">
                            <span class="slider"></span>
                        </label>
                    </div> 

                </div>
            </section>

        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item" id="nav-btn-0"><span class="icon">📆</span><span>달력</span></button>
        <button class="nav-item active" id="nav-btn-1"><span class="icon">🚨</span><span>근무</span></button>
        <button class="nav-item" id="nav-btn-2"><span class="icon">⚙️</span><span>설정</span></button>
    </nav>

    <div id="install-btn">과낙ON 설치하기</div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
