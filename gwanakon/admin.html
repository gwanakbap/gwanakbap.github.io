<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>과낙ON - 관리자</title>
  
  <!-- SheetJS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f4f6f8;
      --text-main: #333;
      --text-sub: #666;
      --card-bg: #ffffff;
      --blue: rgb(172, 190, 227);
      --header-height: 52px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: #d1d5db;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    #admin-container {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background-color: var(--bg-color);
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--blue);
      padding: 0 16px;
      font-size: 18px;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--header-height);
      z-index: 10;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .header-badge {
      font-size: 11px;
      background-color: rgba(30, 41, 59, 0.1);
      color: #1e293b;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 700;
    }

    .main-content {
      padding: 16px;
      flex: 1;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 20px 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
      background-color: #f8fafc;
    }

    .form-input:focus {
      border-color: var(--primary-color);
      background-color: #ffffff;
    }

    .password-mask {
      -webkit-text-security: disc;
    }

    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      background-color: #f8fafc;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .upload-zone:active, .upload-zone.dragover {
      background-color: #eff6ff;
      border-color: var(--primary-color);
    }

    .upload-icon {
      font-size: 32px;
    }

    .upload-text {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .file-info {
      font-size: 12.5px;
      color: var(--primary-color);
      font-weight: 700;
      word-break: break-all;
    }

    #excelFileInput {
      display: none;
    }

    .btn-primary {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-primary:not(:disabled):active {
      background-color: var(--primary-hover);
      transform: scale(0.99);
    }

    .status-msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      text-align: center;
      line-height: 1.4;
    }

    .status-msg.success {
      display: block;
      background-color: #dcfce7;
      color: #15803d;
    }

    .status-msg.error {
      display: block;
      background-color: #fee2e2;
      color: #b91c1c;
    }

    .status-msg.loading {
      display: block;
      background-color: #e0f2fe;
      color: #0369a1;
    }
  </style>
</head>
<body>

<div id="admin-container">
  <header>
    <span>과낙ON 데이터 관리</span>
    <span class="header-badge">Admin</span>
  </header>

  <main class="main-content">
    <div class="card">
      <div class="card-title">📁 엑셀 데이터 업로드</div>
      
      <div class="form-group">
        <label for="monthInput" class="form-label">📅 저장할 년-월</label>
        <input type="month" id="monthInput" class="form-input" />
      </div>

      <div class="upload-zone" id="uploadZone">
        <span class="upload-icon">📄</span>
        <span class="upload-text" id="uploadText">클릭하거나 엑셀(.xlsx) 파일을 이 곳에 드래그하세요</span>
        <span class="file-info" id="fileNameInfo"></span>
      </div>
      <input type="file" id="excelFileInput" accept=".xlsx, .xls" />

      <div class="form-group" style="margin-bottom: 0;">
        <label for="adminPassword" class="form-label">🔒 관리자 비밀번호</label>
        <input type="text" id="adminPassword" class="form-input password-mask" placeholder="비밀번호를 입력하세요" autocomplete="off" />
      </div>

      <button id="uploadBtn" class="btn-primary" disabled>
        <span>서버에 저장하기</span>
      </button>

      <div id="statusMsg" class="status-msg"></div>
    </div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDvEGZcUtz8PIyOLg9M_v71dL7aQG1ntwk",
    authDomain: "gwanak-on.firebaseapp.com",
    databaseURL: "https://gwanak-on-default-rtdb.firebaseio.com",
    projectId: "gwanak-on",
    storageBucket: "gwanak-on.firebasestorage.app",
    messagingSenderId: "101226390647",
    appId: "1:101226390647:web:67c72a62b3079c16e4d272",
    measurementId: "G-EQ5GV6GB99"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const monthInput = document.getElementById('monthInput');
  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('excelFileInput');
  const adminPasswordInput = document.getElementById('adminPassword');
  const uploadBtn = document.getElementById('uploadBtn');
  const uploadText = document.getElementById('uploadText');
  const fileNameInfo = document.getElementById('fileNameInfo');
  const statusMsg = document.getElementById('statusMsg');

  let selectedFile = null;

  // 한글 자모음을 영문 키보드 배열로 치환해주는 함수
  function convertKorToEng(text) {
    const choMap = ['r', 'R', 's', 'e', 'E', 'f', 'a', 'q', 'Q', 't', 'T', 'd', 'w', 'W', 'c', 'z', 'x', 'v', 'g'];
    const jungMap = ['k', 'o', 'i', 'O', 'j', 'p', 'u', 'P', 'h', 'hk', 'ho', 'hl', 'y', 'n', 'nj', 'np', 'nl', 'b', 'm', 'ml', 'l'];
    const jongMap = ['', 'r', 'R', 'rt', 's', 'sw', 'sg', 'e', 'f', 'fr', 'fa', 'fq', 'ft', 'fx', 'fv', 'fg', 'a', 'q', 'qt', 't', 'T', 'd', 'w', 'c', 'z', 'x', 'v', 'g'];
    const jamoMap = {
      'ㄱ':'r', 'ㄲ':'R', 'ㄳ':'rt', 'ㄴ':'s', 'ㄵ':'sw', 'ㄶ':'sg', 'ㄷ':'e', 'ㄸ':'E',
      'ㄹ':'f', 'ㄺ':'fr', 'ㄻ':'fa', 'ㄼ':'fq', 'ㄽ':'ft', 'ㄾ':'fx', 'ㄿ':'fv', 'ㅀ':'fg',
      'ㅁ':'a', 'ㅂ':'q', 'ㅃ':'Q', 'ㅄ':'qt', 'ㅅ':'t', 'ㅆ':'T', 'ㅇ':'d', 'ㅈ':'w',
      'ㅉ':'W', 'ㅊ':'c', 'ㅋ':'z', 'ㅌ':'x', 'ㅍ':'v', 'ㅎ':'g',
      'ㅏ':'k', 'ㅐ':'o', 'ㅑ':'i', 'ㅒ':'O', 'ㅓ':'j', 'ㅔ':'p', 'ㅕ':'u', 'ㅖ':'P',
      'ㅗ':'h', 'ㅘ':'hk', 'ㅙ':'ho', 'ㅚ':'hl', 'ㅛ':'y', 'ㅜ':'n', 'ㅝ':'nj', 'ㅞ':'np',
      'ㅟ':'nl', 'ㅠ':'b', 'ㅡ':'m', 'ㅢ':'ml', 'ㅣ':'l'
    };

    let result = '';
    for (let i = 0; i < text.length; i++) {
      let charCode = text.charCodeAt(i);
      if (charCode >= 0xAC00 && charCode <= 0xD7A3) {
        let offset = charCode - 0xAC00;
        let jongIdx = offset % 28;
        let jungIdx = Math.floor(offset / 28) % 21;
        let choIdx = Math.floor(offset / 28 / 21);
        result += choMap[choIdx] + jungMap[jungIdx] + jongMap[jongIdx];
      } else if (charCode >= 0x3131 && charCode <= 0x3163) {
        result += jamoMap[text[i]] || text[i];
      } else {
        result += text[i];
      }
    }
    return result;
  }

  // Firebase Key 특수문자 치환 함수
  function sanitizeKeys(data) {
    if (Array.isArray(data)) {
      return data.map(item => sanitizeKeys(item));
    } else if (data !== null && typeof data === 'object') {
      const sanitized = {};
      for (const [key, value] of Object.entries(data)) {
        const cleanKey = key.replace(/[.#$/[\]]/g, '_').trim();
        sanitized[cleanKey] = sanitizeKeys(value);
      }
      return sanitized;
    }
    return data;
  }

  // 클릭 이벤트
  uploadZone.addEventListener('click', () => fileInput.click());

  // 파일 선택 이벤트
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) handleFileSelect(file);
  });

  // 드래그 앤 드롭 이벤트 보완
  ['dragenter', 'dragover'].forEach(eventName => {
    uploadZone.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
      uploadZone.classList.add('dragover');
    });
  });

  ['dragleave', 'drop'].forEach(eventName => {
    uploadZone.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
      uploadZone.classList.remove('dragover');
    });
  });

  uploadZone.addEventListener('drop', (e) => {
    const files = e.dataTransfer.files;
    if (files && files.length > 0) {
      // DataTransfer를 활용한 안전한 fileInput 파일 동기화
      const dt = new DataTransfer();
      dt.items.add(files[0]);
      fileInput.files = dt.files;

      handleFileSelect(files[0]);
    }
  });

  // 입력 발생 시 제출 버튼 활성화 여부 체크
  adminPasswordInput.addEventListener('input', checkCanSubmit);
  monthInput.addEventListener('input', checkCanSubmit);
  
  adminPasswordInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter' && !uploadBtn.disabled) {
      uploadBtn.click();
    }
  });

  // 파일 선택 시 화면 UI 처리
  function handleFileSelect(file) {
    selectedFile = file;
    uploadText.innerText = "선택된 파일:";
    fileNameInfo.innerText = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
    showStatus("", "");
    checkCanSubmit();
  }

  // 제출 가능 상태 체크
  function checkCanSubmit() {
    const password = adminPasswordInput.value.trim();
    const selectedMonth = monthInput.value;
    if (selectedFile && password.length > 0 && selectedMonth !== "") {
      uploadBtn.disabled = false;
    } else {
      uploadBtn.disabled = true;
    }
  }

  // Firebase 저장 이벤트
  uploadBtn.addEventListener('click', async () => {
    const enteredPassword = adminPasswordInput.value.trim();
    const selectedMonth = monthInput.value;

    if (!selectedMonth) {
      alert("저장할 년-월을 먼저 선택해 주세요.");
      return;
    }
    if (!selectedFile) {
      alert("먼저 엑셀 파일을 선택해 주세요.");
      return;
    }
    if (!enteredPassword) {
      alert("비밀번호를 입력해 주세요.");
      return;
    }

    uploadBtn.disabled = true;
    showStatus("🔑 비밀번호 확인 및 데이터 처리 중...", "loading");

    try {
      const pwdSnapshot = await get(ref(db, 'admin/password'));
      
      if (!pwdSnapshot.exists()) {
        showStatus("❌ 서버에 관리자 비밀번호가 설정되어 있지 않습니다.", "error");
        uploadBtn.disabled = false;
        return;
      }

      const realPassword = String(pwdSnapshot.val());
      const convertedPassword = convertKorToEng(enteredPassword);

      if (enteredPassword !== realPassword && convertedPassword !== realPassword) {
        showStatus("❌ 비밀번호가 올바르지 않습니다.", "error");
        uploadBtn.disabled = false;
        return;
      }

      showStatus("⏳ 엑셀을 읽어 Firebase 서버에 저장 중입니다...", "loading");

      const reader = new FileReader();
      
      reader.onload = async (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          const firstSheetName = workbook.SheetNames[0];
          const secondSheetName = workbook.SheetNames[1];

          // 1. 시트 1 (월별 당직 데이터) 처리
          const worksheet = workbook.Sheets[firstSheetName];
          worksheet['!ref'] = "B1:K50";
          const rawJsonData1 = XLSX.utils.sheet_to_json(worksheet, {
            raw: false,
            defval: ""
          });
          const jsonData = sanitizeKeys(rawJsonData1);

          const targetRef = ref(db, `gwanak-on/${selectedMonth}`);
          await set(targetRef, jsonData);

          // 2. 시트 2 (1년치 기본 당직 데이터) 처리 및 중복 체크 후 저장
          let defaultStatusMsg = "";
          if (secondSheetName) {
            const worksheet2 = workbook.Sheets[secondSheetName];
            worksheet2['!ref'] = "A3:M500";
            const rawJsonData2 = XLSX.utils.sheet_to_json(worksheet2, {
              raw: false,
              defval: ""
            });
            const jsonData2 = sanitizeKeys(rawJsonData2);

            const targetYear = selectedMonth.split('-')[0];
            const defaultRef = ref(db, `gwanak-on/defaultData/${targetYear}`);
            const defaultSnapshot = await get(defaultRef);

            if (!defaultSnapshot.exists()) {
              await set(defaultRef, jsonData2);
              defaultStatusMsg = `\n(${targetYear}년도 기본 당직리스트 신규 저장 완료)`;
            }
          }

          showStatus(`✅ [${selectedMonth}] 데이터 저장에 성공했습니다!${defaultStatusMsg}`, "success");

          adminPasswordInput.value = "";
          checkCanSubmit();

        } catch (error) {
          console.error(error);
          showStatus("❌ 데이터 저장에 실패했습니다.", "error");
        } finally {
          uploadBtn.disabled = false;
        }
      };

      reader.onerror = () => {
        showStatus("❌ 파일을 읽는 데 실패했습니다.", "error");
        uploadBtn.disabled = false;
      };

      reader.readAsArrayBuffer(selectedFile);

    } catch (error) {
      console.error(error);
      showStatus("❌ 서버 통신 중 오류가 발생했습니다.", "error");
      uploadBtn.disabled = false;
    }
  });

  function showStatus(msg, type) {
    statusMsg.className = "status-msg " + type;
    statusMsg.innerText = msg;
  }
</script>
</body>
</html>
