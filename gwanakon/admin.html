<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>과낙ON - 관리자</title>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f4f6f8;
      --text-main: #333;
      --text-sub: #666;
      --card-bg: #ffffff;
      --blue: rgb(172, 190, 227);
      --header-height: 52px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: #d1d5db;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    #admin-container {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background-color: var(--bg-color);
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--blue);
      padding: 0 16px;
      font-size: 18px;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--header-height);
      z-index: 10;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .header-badge {
      font-size: 11px;
      background-color: rgba(30, 41, 59, 0.1);
      color: #1e293b;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 700;
    }

    .main-content {
      padding: 16px;
      flex: 1;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 20px 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
      background-color: #f8fafc;
    }

    .form-input:focus {
      border-color: var(--primary-color);
      background-color: #ffffff;
    }

    .password-mask {
      -webkit-text-security: disc;
    }

    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      background-color: #f8fafc;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .upload-zone:active, .upload-zone.dragover {
      background-color: #eff6ff;
      border-color: var(--primary-color);
    }

    .upload-icon { font-size: 32px; }

    .upload-text {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .file-info {
      font-size: 12.5px;
      color: var(--primary-color);
      font-weight: 700;
      word-break: break-all;
    }

    #excelFileInput { display: none; }

    .btn-primary {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-primary:not(:disabled):active {
      background-color: var(--primary-hover);
      transform: scale(0.99);
    }

    .status-msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      text-align: center;
      line-height: 1.4;
    }

    .status-msg.success { display: block; background-color: #dcfce7; color: #15803d; }
    .status-msg.error   { display: block; background-color: #fee2e2; color: #b91c1c; }
    .status-msg.loading { display: block; background-color: #e0f2fe; color: #0369a1; }
  </style>
</head>
<body>

<div id="admin-container">
  <header>
    <span>과낙ON 데이터 관리</span>
    <span class="header-badge">Admin</span>
  </header>

  <main class="main-content">
    <div class="card">
      <div class="card-title">📁 엑셀 데이터 업로드</div>
      
      <div class="form-group">
        <label for="monthInput" class="form-label">📅 저장할 년-월</label>
        <input type="month" id="monthInput" class="form-input" />
      </div>

      <div class="upload-zone" id="uploadZone">
        <span class="upload-icon">📄</span>
        <span class="upload-text" id="uploadText">클릭하거나 엑셀(.xlsx) 파일을 이 곳에 드래그하세요</span>
        <span class="file-info" id="fileNameInfo"></span>
      </div>
      <input type="file" id="excelFileInput" accept=".xlsx, .xls" />

      <div class="form-group" style="margin-bottom: 0;">
        <label for="adminPassword" class="form-label">🔒 관리자 비밀번호</label>
        <input type="text" id="adminPassword" class="form-input password-mask" placeholder="비밀번호를 입력하세요" autocomplete="off" />
      </div>

      <button id="uploadBtn" class="btn-primary" disabled>
        <span>서버에 저장하기</span>
      </button>

      <div id="statusMsg" class="status-msg"></div>
    </div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDvEGZcUtz8PIyOLg9M_v71dL7aQG1ntwk",
    authDomain: "gwanak-on.firebaseapp.com",
    databaseURL: "https://gwanak-on-default-rtdb.firebaseio.com",
    projectId: "gwanak-on",
    storageBucket: "gwanak-on.firebasestorage.app",
    messagingSenderId: "101226390647",
    appId: "1:101226390647:web:67c72a62b3079c16e4d272",
    measurementId: "G-EQ5GV6GB99"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ─────────────────────────────────────────────────
  // 유틸: 한글 자모음을 영문 키보드 배열로 치환
  // ─────────────────────────────────────────────────
  function convertKorToEng(text) {
    const choMap = ['r','R','s','e','E','f','a','q','Q','t','T','d','w','W','c','z','x','v','g'];
    const jungMap = ['k','o','i','O','j','p','u','P','h','hk','ho','hl','y','n','nj','np','nl','b','m','ml','l'];
    const jongMap = ['','r','R','rt','s','sw','sg','e','f','fr','fa','fq','ft','fx','fv','fg','a','q','qt','t','T','d','w','c','z','x','v','g'];
    const jamoMap = {
      'ㄱ':'r','ㄲ':'R','ㄳ':'rt','ㄴ':'s','ㄵ':'sw','ㄶ':'sg','ㄷ':'e','ㄸ':'E',
      'ㄹ':'f','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg',
      'ㅁ':'a','ㅂ':'q','ㅃ':'Q','ㅄ':'qt','ㅅ':'t','ㅆ':'T','ㅇ':'d','ㅈ':'w',
      'ㅉ':'W','ㅊ':'c','ㅋ':'z','ㅌ':'x','ㅍ':'v','ㅎ':'g',
      'ㅏ':'k','ㅐ':'o','ㅑ':'i','ㅒ':'O','ㅓ':'j','ㅔ':'p','ㅕ':'u','ㅖ':'P',
      'ㅗ':'h','ㅘ':'hk','ㅙ':'ho','ㅚ':'hl','ㅛ':'y','ㅜ':'n','ㅝ':'nj','ㅞ':'np',
      'ㅟ':'nl','ㅠ':'b','ㅡ':'m','ㅢ':'ml','ㅣ':'l'
    };
    let result = '';
    for (let i = 0; i < text.length; i++) {
      const code = text.charCodeAt(i);
      if (code >= 0xAC00 && code <= 0xD7A3) {
        const offset = code - 0xAC00;
        result += choMap[Math.floor(offset / 28 / 21)]
                + jungMap[Math.floor(offset / 28) % 21]
                + jongMap[offset % 28];
      } else if (code >= 0x3131 && code <= 0x3163) {
        result += jamoMap[text[i]] || text[i];
      } else {
        result += text[i];
      }
    }
    return result;
  }

  function processSheet1(rawData) {
  if (!rawData) return [];

  const list = Array.isArray(rawData) ? rawData : Object.values(rawData);
  if (list.length === 0) return [];

  return list
    .filter(item => String(item.dateStr || '').trim() !== '')
    .map(item => {
      const dateStr = String(item.dateStr || '').trim();
      const parts = dateStr.split('/');

      // 엑셀에서 읽어온 shiftType 검증 (일직/숙직이 아니면 '당직'으로 기본값 설정)
      const rawShiftType = String(item.shiftType || '').trim();
      const shiftType = (rawShiftType === '일직' || rawShiftType === '숙직') ? rawShiftType : '당직';

      return {
        dateStr: dateStr,
        day: parts.length > 1 ? parseInt(parts[1], 10) : 0,
        dayOfWeek: String(item.dayOfWeek || '').trim(),
        isHoliday: String(item.isHoliday || '').trim() === '공휴일',
        leaderRank: String(item.leaderRank || '').trim(),
        leaderName: String(item.leaderName || '').replace(/\s/g, ''),
        worker1Rank: String(item.worker1Rank || '').trim(),
        worker1Name: String(item.worker1Name || '').replace(/\s/g, ''),
        worker2Rank: String(item.worker2Rank || '').trim(),
        worker2Name: String(item.worker2Name || '').replace(/\s/g, ''),
        shiftType: shiftType,
      };
    });
}

function processSheet2(rawData) {
  if (!rawData) return {};

  // 1단계: 날짜별 전체 등장 횟수 미리 카운트
  const dateTotalCountMap = {};
  rawData.forEach(item => {
    const dateStr = String(item.dateStr || '').trim();
    if (dateStr) {
      dateTotalCountMap[dateStr] = (dateTotalCountMap[dateStr] || 0) + 1;
    }
  });

  const monthlyGroup = {};
  const dateCurrentIndexMap = {}; // 날짜별 처리 순번 추적용

  // 2단계: 데이터 가공 및 근무 유형(shiftType) 판별
  rawData.forEach(item => {
    const dateStr = String(item.dateStr || '').trim();
    if (!dateStr) return;

    const parts = dateStr.split('/');
    if (parts.length < 3) return;

    const month = parts[0].padStart(2, '0');
    const day = parseInt(parts[1], 10);
    const year = parts[2].length === 2 ? '20' + parts[2] : parts[2];
    const yearMonth = `${year}-${month}`;

    if (!monthlyGroup[yearMonth]) {
      monthlyGroup[yearMonth] = [];
    }

    // 해당 날짜의 총 개수 및 현재 순번 계산
    const totalCount = dateTotalCountMap[dateStr] || 1;
    dateCurrentIndexMap[dateStr] = (dateCurrentIndexMap[dateStr] || 0) + 1;
    const currentIndex = dateCurrentIndexMap[dateStr];

    // shiftType 결정 조건
    // 1건만 존재할 경우: '당직'
    // 2건 이상 존재할 경우: 첫 번째 '일직', 두 번째 '숙직'
    let shiftType = '당직';
    if (totalCount >= 2) {
      shiftType = currentIndex === 1 ? '일직' : '숙직';
    }

    monthlyGroup[yearMonth].push({
      dateStr: dateStr,
      day: day,
      dayOfWeek: String(item.dayOfWeek || '').trim(),
      isHoliday: String(item.isHoliday || '').trim() === '공휴일',
      leaderRank: String(item.leaderRank || '').trim(),
      leaderName: String(item.leaderName || '').replace(/\s/g, ''),
      worker1Rank: String(item.worker1Rank || '').trim(),
      worker1Name: String(item.worker1Name || '').replace(/\s/g, ''),
      worker2Rank: String(item.worker2Rank || '').trim(),
      worker2Name: String(item.worker2Name || '').replace(/\s/g, ''),
      shiftType: shiftType,
    });
  });

  const monthlyData = {};
  Object.keys(monthlyGroup).forEach(yearMonth => {
    const monthNum = parseInt(yearMonth.split('-')[1], 10);

    monthlyData[yearMonth] = {
      list: monthlyGroup[yearMonth],
      rawHeader: `당직(기본순서) ${monthNum}월`
    };
  });

  return monthlyData;
}

  // ─────────────────────────────────────────────────
  // DOM 요소
  // ─────────────────────────────────────────────────
  const monthInput       = document.getElementById('monthInput');
  const uploadZone       = document.getElementById('uploadZone');
  const fileInput        = document.getElementById('excelFileInput');
  const adminPasswordInput = document.getElementById('adminPassword');
  const uploadBtn        = document.getElementById('uploadBtn');
  const uploadText       = document.getElementById('uploadText');
  const fileNameInfo     = document.getElementById('fileNameInfo');
  const statusMsg        = document.getElementById('statusMsg');

  let selectedFile = null;

  // ─────────────────────────────────────────────────
  // 이벤트 바인딩
  // ─────────────────────────────────────────────────
  uploadZone.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) handleFileSelect(file);
  });

  ['dragenter', 'dragover'].forEach(ev => {
    uploadZone.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation();
      uploadZone.classList.add('dragover');
    });
  });

  ['dragleave', 'drop'].forEach(ev => {
    uploadZone.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation();
      uploadZone.classList.remove('dragover');
    });
  });

  uploadZone.addEventListener('drop', (e) => {
    const files = e.dataTransfer.files;
    if (files && files.length > 0) {
      const dt = new DataTransfer();
      dt.items.add(files[0]);
      fileInput.files = dt.files;
      handleFileSelect(files[0]);
    }
  });

  adminPasswordInput.addEventListener('input', checkCanSubmit);
  monthInput.addEventListener('input', checkCanSubmit);
  adminPasswordInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter' && !uploadBtn.disabled) uploadBtn.click();
  });

  function handleFileSelect(file) {
    selectedFile = file;
    uploadText.innerText = "선택된 파일:";
    fileNameInfo.innerText = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
    showStatus("", "");
    checkCanSubmit();
  }

  function checkCanSubmit() {
    const password = adminPasswordInput.value.trim();
    const selectedMonth = monthInput.value;
    uploadBtn.disabled = !(selectedFile && password.length > 0 && selectedMonth !== "");
  }

  // ─────────────────────────────────────────────────
  // 저장 핸들러
  // ─────────────────────────────────────────────────
  uploadBtn.addEventListener('click', async () => {
    const enteredPassword = adminPasswordInput.value.trim();
    const selectedMonth   = monthInput.value;

    if (!selectedMonth) { alert("저장할 년-월을 먼저 선택해 주세요."); return; }
    if (!selectedFile)  { alert("먼저 엑셀 파일을 선택해 주세요."); return; }
    if (!enteredPassword) { alert("비밀번호를 입력해 주세요."); return; }

    uploadBtn.disabled = true;
    showStatus("🔑 비밀번호 확인 및 데이터 처리 중...", "loading");

    try {
      const pwdSnapshot = await get(ref(db, 'admin/password'));
      if (!pwdSnapshot.exists()) {
        showStatus("❌ 서버에 관리자 비밀번호가 설정되어 있지 않습니다.", "error");
        uploadBtn.disabled = false;
        return;
      }

      const realPassword      = String(pwdSnapshot.val());
      const convertedPassword = convertKorToEng(enteredPassword);

      if (enteredPassword !== realPassword && convertedPassword !== realPassword) {
        showStatus("❌ 비밀번호가 올바르지 않습니다.", "error");
        uploadBtn.disabled = false;
        return;
      }

      showStatus("⏳ 엑셀을 읽어 Firebase 서버에 저장 중입니다...", "loading");

      const reader = new FileReader();

      reader.onload = async (e) => {
        try {
          const data     = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          const [firstSheetName, secondSheetName] = workbook.SheetNames;

          // ── 시트1: 월별 당직 데이터 가공 후 저장 ──────────────────────
          const ws1  = workbook.Sheets[firstSheetName];
          ws1['!ref'] = "B5:K50";

          const raw1 = XLSX.utils.sheet_to_json(ws1, {
            header: [
              "dateStr",
              "dayOfWeek",
              "isHoliday",
              "leaderRank",
              "leaderName",
              "worker1Rank",
              "worker1Name",
              "worker2Rank",
              "worker2Name",
              "shiftType"
            ],
            raw: false,
            defval: ""
          });

          const processedData1 = processSheet1(raw1);
          await set(ref(db, `gwanak-on/${selectedMonth}`), { list: processedData1, rawHeader: `당직상황근무지정 ${firstSheetName}` });

          // ── 시트2: 1년치 기본 당직 → 월별 분리 가공 후 저장 ────────────
          let defaultStatusMsg = "";

          if (secondSheetName) {
            const ws2 = workbook.Sheets[secondSheetName];
            ws2['!ref'] = "A5:I500";

            const raw2 = XLSX.utils.sheet_to_json(ws2, {
              header: [
                "dateStr",
                "dayOfWeek",
                "isHoliday",
                "leaderRank",
                "leaderName",
                "worker1Rank",
                "worker1Name",
                "worker2Rank",
                "worker2Name",
                "shiftType"
              ],
              raw: false,
              defval: ""
            });

            const monthlyData = processSheet2(raw2);
            const savedMonths = [];

            for (const [monthKey, monthData] of Object.entries(monthlyData)) {
              const defaultRef = ref(db, `gwanak-on/defaultData/${monthKey}`);
              const snap = await get(defaultRef);
              if (!snap.exists()) {
                await set(defaultRef, monthData);
                savedMonths.push(monthKey);
              }
            }

            if (savedMonths.length > 0) {
              defaultStatusMsg = `\n(기본 당직 신규 저장: ${savedMonths.join(', ')})`;
            }
          }

          showStatus(`✅ [${selectedMonth}] 데이터 저장에 성공했습니다!${defaultStatusMsg}`, "success");
          adminPasswordInput.value = "";
          checkCanSubmit();

        } catch (error) {
          console.error(error);
          showStatus("❌ 데이터 저장에 실패했습니다.", "error");
        } finally {
          uploadBtn.disabled = false;
        }
      };

      reader.onerror = () => {
        showStatus("❌ 파일을 읽는 데 실패했습니다.", "error");
        uploadBtn.disabled = false;
      };

      reader.readAsArrayBuffer(selectedFile);

    } catch (error) {
      console.error(error);
      showStatus("❌ 서버 통신 중 오류가 발생했습니다.", "error");
      uploadBtn.disabled = false;
    }
  });

  function showStatus(msg, type) {
    statusMsg.className = "status-msg " + type;
    statusMsg.innerText = msg;
  }
</script>
</body>
</html>
