<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>과낙ON - 관리자</title>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f4f6f8;
      --text-main: #333;
      --text-sub: #666;
      --card-bg: #ffffff;
      --blue: rgb(172, 190, 227);
      --header-height: 52px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: #d1d5db;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    #admin-container {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background-color: var(--bg-color);
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--blue);
      padding: 0 16px;
      font-size: 18px;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--header-height);
      z-index: 10;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .header-badge {
      font-size: 11px;
      background-color: rgba(30, 41, 59, 0.1);
      color: #1e293b;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 700;
    }

    .main-content {
      padding: 16px;
      flex: 1;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 20px 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
      background-color: #f8fafc;
    }

    .form-input:focus {
      border-color: var(--primary-color);
      background-color: #ffffff;
    }

    .password-mask {
      -webkit-text-security: disc;
    }

    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      background-color: #f8fafc;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .upload-zone:active, .upload-zone.dragover {
      background-color: #eff6ff;
      border-color: var(--primary-color);
    }

    .upload-icon { font-size: 32px; }

    .upload-text {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .file-info {
      font-size: 12.5px;
      color: var(--primary-color);
      font-weight: 700;
      word-break: break-all;
    }

    #excelFileInput { display: none; }

    .btn-primary {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-primary:not(:disabled):active {
      background-color: var(--primary-hover);
      transform: scale(0.99);
    }

    .status-msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      text-align: center;
      line-height: 1.4;
    }

    .status-msg.success { display: block; background-color: #dcfce7; color: #15803d; }
    .status-msg.error   { display: block; background-color: #fee2e2; color: #b91c1c; }
    .status-msg.loading { display: block; background-color: #e0f2fe; color: #0369a1; }

    /* ── 상황관리요원 편집 UI ── */
    .sit-hint { font-size: 12px; color: var(--text-sub); line-height: 1.4; }

    .sit-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background-color: #f8fafc;
    }

    .sit-row.next {
      border-color: var(--primary-color);
      background-color: #eff6ff;
    }

    .sit-row input[type="radio"] { width: 18px; height: 18px; flex-shrink: 0; }

    .sit-num {
      min-width: 22px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-align: center;
    }

    .sit-row .sit-input {
      flex: 1 1 0;
      min-width: 0;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      background-color: #fff;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .sit-row .sit-input:focus { border-color: var(--primary-color); }

    .sit-actions {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .sit-btn {
      width: 24px;
      height: 26px;
      padding: 0;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      background: #fff;
      font-size: 11px;
      cursor: pointer;
    }

    .sit-btn.del { color: #b91c1c; }

    .sit-add {
      width: 100%;
      padding: 10px;
      border: 1px dashed #94a3b8;
      border-radius: 8px;
      background: #fff;
      color: var(--primary-color);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    #etcStatusMsg { white-space: pre-line; }
  </style>
</head>
<body>

<div id="admin-container">
  <header>
    <span>과낙ON 데이터 관리</span>
    <span class="header-badge">Admin</span>
  </header>

  <main class="main-content">
    <!-- 카드 1: 엑셀 업로드 -->
    <div class="card">
      <div class="card-title">📁 엑셀 데이터 업로드</div>
      
      <div class="form-group">
        <label for="monthInput" class="form-label">📅 저장할 년-월</label>
        <input type="month" id="monthInput" class="form-input" />
      </div>

      <div class="upload-zone" id="uploadZone">
        <span class="upload-icon">📄</span>
        <span class="upload-text" id="uploadText">클릭하거나 엑셀(.xlsx) 파일을 이 곳에 드래그하세요</span>
        <span class="file-info" id="fileNameInfo"></span>
      </div>
      <input type="file" id="excelFileInput" accept=".xlsx, .xls" />

      <div class="form-group" style="margin-bottom: 0;">
        <label for="adminPassword" class="form-label">🔒 관리자 비밀번호</label>
        <input type="text" id="adminPassword" class="form-input password-mask" placeholder="비밀번호를 입력하세요" autocomplete="off" />
      </div>

      <button id="uploadBtn" class="btn-primary" disabled>
        <span>서버에 저장하기</span>
      </button>

      <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- 카드 2: 기타 탭 설정 -->
    <div class="card" style="margin-top: 16px;">
      <div class="card-title">📋 기타 탭 설정</div>

      <div class="form-group">
        <label for="emergencyTeamSelect" class="form-label">🚨 비상근무 편성표 강조 조</label>
        <select id="emergencyTeamSelect" class="form-input">
          <option value="1">1조</option>
          <option value="2">2조</option>
          <option value="3">3조</option>
          <option value="4">4조</option>
        </select>
      </div>

      <div class="form-group">
        <label for="supportGroupSelect" class="form-label">🚒 긴급지원단 강조 조</label>
        <select id="supportGroupSelect" class="form-input">
          <option value="A">A조</option>
          <option value="B">B조</option>
        </select>
      </div>

      <details class="form-group">
        <summary class="form-label" style="cursor:pointer;">📋 상황관리요원 순서 (눌러서 펼치기)</summary>
        <p class="sit-hint" style="margin-top:6px;">왼쪽 ◉ 를 선택하면 그 사람이 "다음 차례"입니다. 날짜가 없으면 비워 두세요.</p>
        <div id="situationRows" style="display:flex; flex-direction:column; gap:4px; max-height:55vh; overflow-y:auto; padding-right:2px; margin-top:8px;"></div>
        <button type="button" id="situationAddBtn" class="sit-add" style="margin-top:8px;">+ 항목 추가</button>
      </details>

      <div class="form-group" style="margin-bottom: 0;">
        <label for="etcPassword" class="form-label">🔒 관리자 비밀번호</label>
        <input type="text" id="etcPassword" class="form-input password-mask" placeholder="비밀번호를 입력하세요" autocomplete="off" />
      </div>

      <button id="etcSaveBtn" class="btn-primary" disabled>
        <span>기타 설정 저장하기</span>
      </button>

      <div id="etcStatusMsg" class="status-msg"></div>
    </div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDvEGZcUtz8PIyOLg9M_v71dL7aQG1ntwk",
    authDomain: "gwanak-on.firebaseapp.com",
    databaseURL: "https://gwanak-on-default-rtdb.firebaseio.com",
    projectId: "gwanak-on",
    storageBucket: "gwanak-on.firebasestorage.app",
    messagingSenderId: "101226390647",
    appId: "1:101226390647:web:67c72a62b3079c16e4d272",
    measurementId: "G-EQ5GV6GB99"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ─────────────────────────────────────────────────
  // 유틸: 한글 자모음을 영문 키보드 배열로 치환
  // ─────────────────────────────────────────────────
  function convertKorToEng(text) {
    const choMap = ['r','R','s','e','E','f','a','q','Q','t','T','d','w','W','c','z','x','v','g'];
    const jungMap = ['k','o','i','O','j','p','u','P','h','hk','ho','hl','y','n','nj','np','nl','b','m','ml','l'];
    const jongMap = ['','r','R','rt','s','sw','sg','e','f','fr','fa','fq','ft','fx','fv','fg','a','q','qt','t','T','d','w','c','z','x','v','g'];
    const jamoMap = {
      'ㄱ':'r','ㄲ':'R','ㄳ':'rt','ㄴ':'s','ㄵ':'sw','ㄶ':'sg','ㄷ':'e','ㄸ':'E',
      'ㄹ':'f','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg',
      'ㅁ':'a','ㅂ':'q','ㅃ':'Q','ㅄ':'qt','ㅅ':'t','ㅆ':'T','ㅇ':'d','ㅈ':'w',
      'ㅉ':'W','ㅊ':'c','ㅋ':'z','ㅌ':'x','ㅍ':'v','ㅎ':'g',
      'ㅏ':'k','ㅐ':'o','ㅑ':'i','ㅒ':'O','ㅓ':'j','ㅔ':'p','ㅕ':'u','ㅖ':'P',
      'ㅗ':'h','ㅘ':'hk','ㅙ':'ho','ㅚ':'hl','ㅛ':'y','ㅜ':'n','ㅝ':'nj','ㅞ':'np',
      'ㅟ':'nl','ㅠ':'b','ㅡ':'m','ㅢ':'ml','ㅣ':'l'
    };
    let result = '';
    for (let i = 0; i < text.length; i++) {
      const code = text.charCodeAt(i);
      if (code >= 0xAC00 && code <= 0xD7A3) {
        const offset = code - 0xAC00;
        result += choMap[Math.floor(offset / 28 / 21)]
                + jungMap[Math.floor(offset / 28) % 21]
                + jongMap[offset % 28];
      } else if (code >= 0x3131 && code <= 0x3163) {
        result += jamoMap[text[i]] || text[i];
      } else {
        result += text[i];
      }
    }
    return result;
  }

  function processSheet1(rawData) {
    if (!rawData) return [];

    const list = Array.isArray(rawData) ? rawData : Object.values(rawData);
    if (list.length === 0) return [];

    return list
      .filter(item => String(item.dateStr || '').trim() !== '')
      .map(item => {
        const dateStr = String(item.dateStr || '').trim();
        const parts = dateStr.split('/');

        // 엑셀에서 읽어온 shiftType 검증 (일직/숙직이 아니면 '당직'으로 기본값 설정)
        const rawShiftType = String(item.shiftType || '').trim();
        const shiftType = (rawShiftType === '일직' || rawShiftType === '숙직') ? rawShiftType : '당직';

        return {
          dateStr: dateStr,
          day: parts.length > 1 ? parseInt(parts[1], 10) : 0,
          dayOfWeek: String(item.dayOfWeek || '').trim(),
          isHoliday: String(item.isHoliday || '').trim() === '공휴일',
          leaderRank: String(item.leaderRank || '').trim(),
          leaderName: String(item.leaderName || '').replace(/\s/g, ''),
          worker1Rank: String(item.worker1Rank || '').trim(),
          worker1Name: String(item.worker1Name || '').replace(/\s/g, ''),
          worker2Rank: String(item.worker2Rank || '').trim(),
          worker2Name: String(item.worker2Name || '').replace(/\s/g, ''),
          shiftType: shiftType,
        };
      });
  }

  function processSheet2(rawData) {
    if (!rawData) return {};

    // 1단계: 날짜별 전체 등장 횟수 미리 카운트
    const dateTotalCountMap = {};
    rawData.forEach(item => {
      const dateStr = String(item.dateStr || '').trim();
      if (dateStr) {
        dateTotalCountMap[dateStr] = (dateTotalCountMap[dateStr] || 0) + 1;
      }
    });

    const monthlyGroup = {};
    const dateCurrentIndexMap = {}; // 날짜별 처리 순번 추적용

    // 2단계: 데이터 가공 및 근무 유형(shiftType) 판별
    rawData.forEach(item => {
      const dateStr = String(item.dateStr || '').trim();
      if (!dateStr) return;

      const parts = dateStr.split('/');
      if (parts.length < 3) return;

      const month = parts[0].padStart(2, '0');
      const day = parseInt(parts[1], 10);
      const year = parts[2].length === 2 ? '20' + parts[2] : parts[2];
      const yearMonth = `${year}-${month}`;

      if (!monthlyGroup[yearMonth]) {
        monthlyGroup[yearMonth] = [];
      }

      // 해당 날짜의 총 개수 및 현재 순번 계산
      const totalCount = dateTotalCountMap[dateStr] || 1;
      dateCurrentIndexMap[dateStr] = (dateCurrentIndexMap[dateStr] || 0) + 1;
      const currentIndex = dateCurrentIndexMap[dateStr];

      // shiftType 결정 조건
      // 1건만 존재할 경우: '당직'
      // 2건 이상 존재할 경우: 첫 번째 '일직', 두 번째 '숙직'
      let shiftType = '당직';
      if (totalCount >= 2) {
        shiftType = currentIndex === 1 ? '일직' : '숙직';
      }

      monthlyGroup[yearMonth].push({
        dateStr: dateStr,
        day: day,
        dayOfWeek: String(item.dayOfWeek || '').trim(),
        isHoliday: String(item.isHoliday || '').trim() === '공휴일',
        leaderRank: String(item.leaderRank || '').trim(),
        leaderName: String(item.leaderName || '').replace(/\s/g, ''),
        worker1Rank: String(item.worker1Rank || '').trim(),
        worker1Name: String(item.worker1Name || '').replace(/\s/g, ''),
        worker2Rank: String(item.worker2Rank || '').trim(),
        worker2Name: String(item.worker2Name || '').replace(/\s/g, ''),
        shiftType: shiftType,
      });
    });

    const monthlyData = {};
    Object.keys(monthlyGroup).forEach(yearMonth => {
      const monthNum = parseInt(yearMonth.split('-')[1], 10);

      monthlyData[yearMonth] = {
        list: monthlyGroup[yearMonth],
        rawHeader: `당직(기본순서) ${monthNum}월`
      };
    });

    return monthlyData;
  }

  // ─────────────────────────────────────────────────
  // DOM 요소 (엑셀 업로드)
  // ─────────────────────────────────────────────────
  const monthInput       = document.getElementById('monthInput');
  const uploadZone       = document.getElementById('uploadZone');
  const fileInput        = document.getElementById('excelFileInput');
  const adminPasswordInput = document.getElementById('adminPassword');
  const uploadBtn        = document.getElementById('uploadBtn');
  const uploadText       = document.getElementById('uploadText');
  const fileNameInfo     = document.getElementById('fileNameInfo');
  const statusMsg        = document.getElementById('statusMsg');

  let selectedFile = null;

  // ─────────────────────────────────────────────────
  // 이벤트 바인딩
  // ─────────────────────────────────────────────────
  uploadZone.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) handleFileSelect(file);
  });

  ['dragenter', 'dragover'].forEach(ev => {
    uploadZone.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation();
      uploadZone.classList.add('dragover');
    });
  });

  ['dragleave', 'drop'].forEach(ev => {
    uploadZone.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation();
      uploadZone.classList.remove('dragover');
    });
  });

  uploadZone.addEventListener('drop', (e) => {
    const files = e.dataTransfer.files;
    if (files && files.length > 0) {
      const dt = new DataTransfer();
      dt.items.add(files[0]);
      fileInput.files = dt.files;
      handleFileSelect(files[0]);
    }
  });

  adminPasswordInput.addEventListener('input', checkCanSubmit);
  monthInput.addEventListener('input', checkCanSubmit);
  adminPasswordInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter' && !uploadBtn.disabled) uploadBtn.click();
  });

  function handleFileSelect(file) {
    selectedFile = file;
    uploadText.innerText = "선택된 파일:";
    fileNameInfo.innerText = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
    showStatus("", "");
    checkCanSubmit();
  }

  function checkCanSubmit() {
    const password = adminPasswordInput.value.trim();
    const selectedMonth = monthInput.value;
    uploadBtn.disabled = !(selectedFile && password.length > 0 && selectedMonth !== "");
  }

  // ─────────────────────────────────────────────────
  // 저장 핸들러 (엑셀 업로드)
  // ─────────────────────────────────────────────────
  uploadBtn.addEventListener('click', async () => {
    const enteredPassword = adminPasswordInput.value.trim();
    const selectedMonth   = monthInput.value;

    if (!selectedMonth) { alert("저장할 년-월을 먼저 선택해 주세요."); return; }
    if (!selectedFile)  { alert("먼저 엑셀 파일을 선택해 주세요."); return; }
    if (!enteredPassword) { alert("비밀번호를 입력해 주세요."); return; }

    uploadBtn.disabled = true;
    showStatus("🔑 비밀번호 확인 및 데이터 처리 중...", "loading");

    try {
      const pwdSnapshot = await get(ref(db, 'admin/password'));
      if (!pwdSnapshot.exists()) {
        showStatus("❌ 서버에 관리자 비밀번호가 설정되어 있지 않습니다.", "error");
        uploadBtn.disabled = false;
        return;
      }

      const realPassword      = String(pwdSnapshot.val());
      const convertedPassword = convertKorToEng(enteredPassword);

      if (enteredPassword !== realPassword && convertedPassword !== realPassword) {
        showStatus("❌ 비밀번호가 올바르지 않습니다.", "error");
        uploadBtn.disabled = false;
        return;
      }

      showStatus("⏳ 엑셀을 읽어 Firebase 서버에 저장 중입니다...", "loading");

      const reader = new FileReader();

      reader.onload = async (e) => {
        try {
          const data     = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          const [firstSheetName, secondSheetName] = workbook.SheetNames;

          // ── 시트1: 월별 당직 데이터 가공 후 저장 ──────────────────────
          const ws1  = workbook.Sheets[firstSheetName];
          ws1['!ref'] = "B5:K50";

          const raw1 = XLSX.utils.sheet_to_json(ws1, {
            header: [
              "dateStr",
              "dayOfWeek",
              "isHoliday",
              "leaderRank",
              "leaderName",
              "worker1Rank",
              "worker1Name",
              "worker2Rank",
              "worker2Name",
              "shiftType"
            ],
            raw: false,
            defval: ""
          });

          const processedData1 = processSheet1(raw1);
          await set(ref(db, `gwanak-on/${selectedMonth}`), { list: processedData1, rawHeader: `당직상황근무지정 ${firstSheetName}` });

          // ── 시트2: 1년치 기본 당직 → 월별 분리 가공 후 저장 ────────────
          let defaultStatusMsg = "";

          if (secondSheetName) {
            const ws2 = workbook.Sheets[secondSheetName];
            ws2['!ref'] = "A5:I500";

            const raw2 = XLSX.utils.sheet_to_json(ws2, {
              header: [
                "dateStr",
                "dayOfWeek",
                "isHoliday",
                "leaderRank",
                "leaderName",
                "worker1Rank",
                "worker1Name",
                "worker2Rank",
                "worker2Name",
                "shiftType"
              ],
              raw: false,
              defval: ""
            });

            const monthlyData = processSheet2(raw2);
            const savedMonths = [];

            for (const [monthKey, monthData] of Object.entries(monthlyData)) {
              const defaultRef = ref(db, `gwanak-on/defaultData/${monthKey}`);
              const snap = await get(defaultRef);
              if (!snap.exists()) {
                await set(defaultRef, monthData);
                savedMonths.push(monthKey);
              }
            }

            if (savedMonths.length > 0) {
              defaultStatusMsg = `\n(기본 당직 신규 저장: ${savedMonths.join(', ')})`;
            }
          }

          showStatus(`✅ [${selectedMonth}] 데이터 저장에 성공했습니다!${defaultStatusMsg}`, "success");
          adminPasswordInput.value = "";
          checkCanSubmit();

        } catch (error) {
          console.error(error);
          showStatus("❌ 데이터 저장에 실패했습니다.", "error");
        } finally {
          uploadBtn.disabled = false;
        }
      };

      reader.onerror = () => {
        showStatus("❌ 파일을 읽는 데 실패했습니다.", "error");
        uploadBtn.disabled = false;
      };

      reader.readAsArrayBuffer(selectedFile);

    } catch (error) {
      console.error(error);
      showStatus("❌ 서버 통신 중 오류가 발생했습니다.", "error");
      uploadBtn.disabled = false;
    }
  });

  function showStatus(msg, type) {
    statusMsg.className = "status-msg " + type;
    statusMsg.innerText = msg;
  }

  // ─────────────────────────────────────────────────
  // 기타 탭 설정 (비상근무 / 긴급지원단 / 상황관리요원)
  // ─────────────────────────────────────────────────
  const emergencyTeamSelect = document.getElementById('emergencyTeamSelect');
  const supportGroupSelect  = document.getElementById('supportGroupSelect');
  const situationRowsEl     = document.getElementById('situationRows');
  const situationAddBtn     = document.getElementById('situationAddBtn');
  const etcPasswordInput    = document.getElementById('etcPassword');
  const etcSaveBtn          = document.getElementById('etcSaveBtn');
  const etcStatusMsg        = document.getElementById('etcStatusMsg');

  function showEtcStatus(msg, type) {
    etcStatusMsg.className = "status-msg " + type;
    etcStatusMsg.innerText = msg;
  }

  // ── 상황관리요원 편집 상태 ──
  let situationRows = [];   // [{ name, date }]
  let situationNext = 1;    // 다음 차례 번호 (1부터)

  function renderSituationRows(focusIndex = -1) {
    situationRowsEl.replaceChildren();

    situationRows.forEach((row, i) => {
      const num = i + 1;
      const div = document.createElement('div');
      div.className = 'sit-row' + (num === situationNext ? ' next' : '');

      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'situationNext';
      radio.checked = num === situationNext;
      radio.addEventListener('change', () => {
        situationNext = num;
        renderSituationRows();
      });

      const numEl = document.createElement('span');
      numEl.className = 'sit-num';
      numEl.textContent = num;

      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.className = 'sit-input';
      nameInput.placeholder = '이름';
      nameInput.value = row.name;
      nameInput.addEventListener('input', () => { row.name = nameInput.value; });

      const dateInput = document.createElement('input');
      dateInput.type = 'text';
      dateInput.className = 'sit-input';
      dateInput.placeholder = '날짜 (예: 2026.07.20.)';
      dateInput.value = row.date;
      dateInput.addEventListener('input', () => { row.date = dateInput.value; });

      const actions = document.createElement('div');
      actions.className = 'sit-actions';

      const makeBtn = (label, cls, onClick, disabled) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'sit-btn ' + cls;
        b.textContent = label;
        b.disabled = !!disabled;
        b.addEventListener('click', onClick);
        return b;
      };

      actions.append(
        makeBtn('▲', '', () => moveSituationRow(i, i - 1), i === 0),
        makeBtn('▼', '', () => moveSituationRow(i, i + 1), i === situationRows.length - 1),
        makeBtn('✕', 'del', () => removeSituationRow(i))
      );

      div.append(radio, numEl, nameInput, dateInput, actions);
      situationRowsEl.appendChild(div);

      if (i === focusIndex) nameInput.focus();
    });
  }

  function moveSituationRow(from, to) {
    if (to < 0 || to >= situationRows.length) return;
    [situationRows[from], situationRows[to]] = [situationRows[to], situationRows[from]];

    // "다음 차례"가 같은 사람을 계속 가리키도록 보정
    if (situationNext === from + 1) situationNext = to + 1;
    else if (situationNext === to + 1) situationNext = from + 1;

    renderSituationRows();
  }

  function removeSituationRow(i) {
    const name = situationRows[i].name.trim() || `${i + 1}번`;
    if (!confirm(`'${name}' 항목을 삭제할까요?`)) return;

    situationRows.splice(i, 1);

    if (situationNext > i + 1) situationNext -= 1;
    if (situationNext > situationRows.length) situationNext = situationRows.length;
    if (situationNext < 1) situationNext = 1;

    renderSituationRows();
  }

  situationAddBtn.addEventListener('click', () => {
    situationRows.push({ name: '', date: '' });
    renderSituationRows(situationRows.length - 1);
  });

  // 저장 전 검증 및 변환
  function buildSituationList() {
    if (situationRows.length === 0) return { error: '상황관리요원 항목이 없습니다.' };

    const list = [];
    for (let i = 0; i < situationRows.length; i++) {
      const name = situationRows[i].name.trim();
      if (!name) return { error: `${i + 1}번 항목의 이름이 비어 있습니다.` };
      list.push({ name, date: situationRows[i].date.trim() || '-' });
    }
    return { list };
  }

  // ── 현재 저장된 값 불러오기 ──
  (async () => {
    try {
      const etcSnap = await get(ref(db, 'gwanak-on/etcConfig'));

      if (etcSnap.exists()) {
        const v = etcSnap.val();
        if (v.emergencyTeam) emergencyTeamSelect.value = String(v.emergencyTeam);
        if (v.supportGroup)  supportGroupSelect.value  = v.supportGroup;

        const sit = v.situationOrder;
        if (sit) {
          const arr = Array.isArray(sit.list) ? sit.list : Object.values(sit.list || {});
          situationRows = arr.map(it => ({
            name: String(it?.name ?? ''),
            date: (it?.date && it.date !== '-') ? String(it.date) : ''
          }));
          const n = Number(sit.nextTurn);
          situationNext = (Number.isInteger(n) && n >= 1 && n <= situationRows.length) ? n : 1;
        }
      }
    } catch (err) {
      console.error(err);
      showEtcStatus("❌ 현재 설정을 불러오지 못했습니다.", "error");
    }

    renderSituationRows();
  })();

  // ── 저장 ──
  etcPasswordInput.addEventListener('input', () => {
    etcSaveBtn.disabled = etcPasswordInput.value.trim().length === 0;
  });
  etcPasswordInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter' && !etcSaveBtn.disabled) etcSaveBtn.click();
  });

  etcSaveBtn.addEventListener('click', async () => {
    const entered = etcPasswordInput.value.trim();
    if (!entered) return;

    const built = buildSituationList();
    if (built.error) { showEtcStatus("❌ " + built.error, "error"); return; }

    const nextTurn = situationNext;
    if (nextTurn < 1 || nextTurn > built.list.length) {
      showEtcStatus("❌ 다음 차례를 선택해 주세요.", "error");
      return;
    }

    etcSaveBtn.disabled = true;
    showEtcStatus("🔑 비밀번호 확인 중...", "loading");

    try {
      const pwdSnap = await get(ref(db, 'admin/password'));
      if (!pwdSnap.exists()) {
        showEtcStatus("❌ 서버에 관리자 비밀번호가 설정되어 있지 않습니다.", "error");
        return;
      }

      const realPassword = String(pwdSnap.val());
      if (entered !== realPassword && convertKorToEng(entered) !== realPassword) {
        showEtcStatus("❌ 비밀번호가 올바르지 않습니다.", "error");
        return;
      }

      const now = new Date().toISOString();

      await set(ref(db, 'gwanak-on/etcConfig'), {
        emergencyTeam: Number(emergencyTeamSelect.value),
        supportGroup: supportGroupSelect.value,
        situationOrder: {
          nextTurn,
          list: built.list
        },
        updatedAt: now
      });

      showEtcStatus(
        `✅ 저장되었습니다.\n비상근무 ${emergencyTeamSelect.value}조 / 긴급지원단 ${supportGroupSelect.value}조\n상황관리요원 ${built.list.length}명, 다음 차례 ${nextTurn}번 ${built.list[nextTurn - 1].name}`,
        "success"
      );
      etcPasswordInput.value = "";
    } catch (err) {
      console.error(err);
      showEtcStatus("❌ 저장에 실패했습니다.", "error");
    } finally {
      etcSaveBtn.disabled = etcPasswordInput.value.trim().length === 0;
    }
  });
</script>
</body>
</html>
