<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>과낙밥 - 관리자</title>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f4f6f8;
      --text-main: #333;
      --text-sub: #666;
      --card-bg: #ffffff;
      --blue: rgb(172, 190, 227);
      --header-height: 52px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: #d1d5db;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    #admin-container {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background-color: var(--bg-color);
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--blue);
      padding: 0 16px;
      font-size: 18px;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--header-height);
      z-index: 10;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .header-badge {
      font-size: 11px;
      background-color: rgba(30, 41, 59, 0.1);
      color: #1e293b;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 700;
    }

    .main-content {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 20px 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .team-mapping-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .team-input-box {
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .team-input-box label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .team-input-box input {
      width: 100%;
      padding: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      outline: none;
      background-color: #fff;
    }

    .team-input-box input:focus {
      border-color: var(--primary-color);
    }

    .team-input-box input.error-input {
      border-color: #ef4444;
      background-color: #fef2f2;
    }

    .mapping-error-msg {
      font-size: 12px;
      color: #ef4444;
      font-weight: 600;
      display: none;
      text-align: center;
      margin-top: 4px;
    }

    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      background-color: #f8fafc;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .upload-zone:active, .upload-zone.dragover {
      background-color: #eff6ff;
      border-color: var(--primary-color);
    }

    .upload-icon { font-size: 28px; }

    .upload-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .file-info {
      font-size: 12px;
      color: var(--primary-color);
      font-weight: 700;
      word-break: break-all;
    }

    #excelFileInput { display: none; }

    .btn-primary {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-primary:not(:disabled):active {
      background-color: var(--primary-hover);
      transform: scale(0.99);
    }

    .status-msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      text-align: center;
      line-height: 1.4;
    }

    .status-msg.success { display: block; background-color: #dcfce7; color: #15803d; }
    .status-msg.error   { display: block; background-color: #fee2e2; color: #b91c1c; }
    .status-msg.loading { display: block; background-color: #e0f2fe; color: #0369a1; }
  </style>
</head>
<body>

<div id="admin-container">
  <header>
    <span>과낙밥 데이터 관리</span>
    <span class="header-badge">Meal Admin</span>
  </header>

  <main class="main-content">
    <!-- 팀 컬러 매핑 설정 카드 -->
    <div class="card">
      <div class="card-title">🎨 팀별 숫자 매핑 설정</div>
      <div class="team-mapping-grid">
        <div class="team-input-box">
          <label for="teamRed">빨강 매칭</label>
          <input type="number" id="teamRed" value="1" min="1" max="10" />
        </div>
        <div class="team-input-box">
          <label for="teamYellow">노랑 매칭</label>
          <input type="number" id="teamYellow" value="2" min="1" max="10" />
        </div>
        <div class="team-input-box">
          <label for="teamBlue">파랑 매칭</label>
          <input type="number" id="teamBlue" value="3" min="1" max="10" />
        </div>
      </div>
      <div id="mappingErrorMsg" class="mapping-error-msg">⚠️ 동일한 팀 번호는 중복으로 사용할 수 없습니다.</div>
    </div>

    <!-- 파일 업로드 카드 -->
    <div class="card">
      <div class="card-title">📁 식단 엑셀 데이터 업로드</div>

      <div class="upload-zone" id="uploadZone">
        <span class="upload-icon">📄</span>
        <span class="upload-text" id="uploadText">클릭하거나 엑셀(.xlsx) 파일을 이 곳에 드래그하세요</span>
        <span class="file-info" id="fileNameInfo"></span>
      </div>
      <input type="file" id="excelFileInput" accept=".xlsx, .xls" />

      <button id="uploadBtn" class="btn-primary" disabled>
        <span>서버에 식단 저장하기</span>
      </button>

      <div id="statusMsg" class="status-msg"></div>
    </div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDvEGZcUtz8PIyOLg9M_v71dL7aQG1ntwk",
    authDomain: "gwanak-on.firebaseapp.com",
    databaseURL: "https://gwanak-on-default-rtdb.firebaseio.com",
    projectId: "gwanak-on",
    storageBucket: "gwanak-on.firebasestorage.app",
    messagingSenderId: "101226390647",
    appId: "1:101226390647:web:67c72a62b3079c16e4d272",
    measurementId: "G-EQ5GV6GB99"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // DOM 요소
  const uploadZone   = document.getElementById('uploadZone');
  const fileInput    = document.getElementById('excelFileInput');
  const uploadBtn    = document.getElementById('uploadBtn');
  const uploadText   = document.getElementById('uploadText');
  const fileNameInfo = document.getElementById('fileNameInfo');
  const statusMsg    = document.getElementById('statusMsg');
  const mappingErrorMsg = document.getElementById('mappingErrorMsg');

  // 팀 매핑 입력 요소
  const teamRedInput    = document.getElementById('teamRed');
  const teamYellowInput = document.getElementById('teamYellow');
  const teamBlueInput   = document.getElementById('teamBlue');

  let selectedFile = null;

  // 이벤트 바인딩
  uploadZone.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) handleFileSelect(file);
  });

  ['dragenter', 'dragover'].forEach(ev => {
    uploadZone.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation();
      uploadZone.classList.add('dragover');
    });
  });

  ['dragleave', 'drop'].forEach(ev => {
    uploadZone.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation();
      uploadZone.classList.remove('dragover');
    });
  });

  uploadZone.addEventListener('drop', (e) => {
    const files = e.dataTransfer.files;
    if (files && files.length > 0) {
      const dt = new DataTransfer();
      dt.items.add(files[0]);
      fileInput.files = dt.files;
      handleFileSelect(files[0]);
    }
  });

  function handleFileSelect(file) {
    selectedFile = file;
    uploadText.innerText = "선택된 파일:";
    fileNameInfo.innerText = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
    showStatus("", "");
    validateAndToggleSubmit();
  }

  // 팀 번호 중복 검사 및 버튼 상태 업데이트
  [teamRedInput, teamYellowInput, teamBlueInput].forEach(input => {
    input.addEventListener('input', validateAndToggleSubmit);
  });

  function validateAndToggleSubmit() {
    const redVal = parseInt(teamRedInput.value);
    const yellowVal = parseInt(teamYellowInput.value);
    const blueVal = parseInt(teamBlueInput.value);

    // 입력값 중복 여부 확인
    const hasDuplicate = (redVal === yellowVal) || (redVal === blueVal) || (yellowVal === blueVal);

    if (hasDuplicate) {
      teamRedInput.classList.add('error-input');
      teamYellowInput.classList.add('error-input');
      teamBlueInput.classList.add('error-input');
      mappingErrorMsg.style.display = 'block';
      uploadBtn.disabled = true; // 중복 시 업로드 불가
    } else {
      teamRedInput.classList.remove('error-input');
      teamYellowInput.classList.remove('error-input');
      teamBlueInput.classList.remove('error-input');
      mappingErrorMsg.style.display = 'none';

      // 파일이 선택된 경우에만 버튼 활성화
      uploadBtn.disabled = !selectedFile;
    }
  }

  // 저장 핸들러
  uploadBtn.addEventListener('click', async () => {
    if (!selectedFile) {
      alert("먼저 엑셀 파일을 선택해 주세요.");
      return;
    }

    const redVal = parseInt(teamRedInput.value) || 1;
    const yellowVal = parseInt(teamYellowInput.value) || 2;
    const blueVal = parseInt(teamBlueInput.value) || 3;

    // 한 번 더 중복 체크
    if (redVal === yellowVal || redVal === blueVal || yellowVal === blueVal) {
      alert("동일한 팀 번호는 중복으로 사용할 수 없습니다.");
      return;
    }

    uploadBtn.disabled = true;
    showStatus("⏳ 엑셀 데이터를 읽고 변환 중입니다...", "loading");

    const reader = new FileReader();

    reader.onload = async (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        worksheet['!ref'] = "B2:H20"; // B열 ~ H열 범위 지정

        // header: 1 옵션을 사용하여 엑셀을 행렬(2차원 배열)로 가져옴
        const rows = XLSX.utils.sheet_to_json(worksheet, {
            header: 1, 
            raw: false, 
            defval: ""
        });

        const daysArray = [];
        const currentYear = new Date().getFullYear();
        const systemMonth = new Date().getMonth() + 1;

        if (rows.length > 0) {
            const dateRow = rows[0]; // 첫 번째 행 (날짜들이 들어있는 행)
            const colCount = dateRow.length;

            for (let col = 0; col < colCount; col++) {
                const rawDateCell = (dateRow[col] || "").toString().trim();
                if (!rawDateCell) continue;

                // aaa나 괄호 유무와 상관없이 월/일 숫자 추출
                const cleanDateStr = rawDateCell.replace(/[^0-9월일]/g, ''); 
                let labelText = cleanDateStr;
                
                const match = cleanDateStr.match(/(\d+)월\s*(\d+)일/);
                if (match) {
                    const month = parseInt(match[1], 10);
                    const day = parseInt(match[2], 10);
                    
                    let targetYear = currentYear;
                    if (systemMonth === 12 && month === 1) targetYear = currentYear + 1;
                    else if (systemMonth === 1 && month === 12) targetYear = currentYear - 1;

                    const dateObj = new Date(targetYear, month - 1, day);
                    if (dateObj.getMonth() === month - 1) {
                        const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
                        labelText = `${weekDays[dateObj.getDay()]}(${cleanDateStr})`;
                    }
                }

                // 행 인덱스로 안전하게 데이터 접근하는 헬퍼 함수
                const getVal = (rowIdx) => {
                    return rows[rowIdx] && rows[rowIdx][col] ? rows[rowIdx][col].toString().trim() : "";
                };

                // 아침 메뉴 & 팀
                const morningItems = [1, 2, 3, 4, 5].map(idx => getVal(idx)).filter(val => val !== "");
                const morningTeam = parseInt(getVal(6)) || 1;

                // 점심 메뉴 & 팀
                const afternoonItems = [7, 8, 9, 10, 11].map(idx => getVal(idx)).filter(val => val !== "");
                const afternoonTeam = parseInt(getVal(12)) || 1;

                // 저녁 메뉴 & 팀
                const eveningItems = [13, 14, 15, 16, 17].map(idx => getVal(idx)).filter(val => val !== "");
                const eveningTeam = parseInt(getVal(18)) || 1;

                daysArray.push({
                    label: labelText,
                    meals: {
                        morning: { teamNumber: morningTeam, items: morningItems },
                        afternoon: { teamNumber: afternoonTeam, items: afternoonItems },
                        evening: { teamNumber: eveningTeam, items: eveningItems }
                    }
                });
            }
        }

        const finalPayload = {
            meta: {
                generatedAt: new Date().toISOString(),
                teamColor: {
                    "빨강": redVal,
                    "노랑": yellowVal,
                    "파랑": blueVal
                }
            },
            days: daysArray
        };

        showStatus("⏳ Firebase 서버에 저장 중입니다...", "loading");

        // gwanakbap 경로에 저장
        await set(ref(db, 'gwanakbap'), finalPayload);

        showStatus("✅ 식단 데이터가 성공적으로 저장되었습니다.", "success");
        selectedFile = null;
        fileInput.value = "";
        uploadText.innerText = "클릭하거나 엑셀(.xlsx) 파일을 이 곳에 드래그하세요";
        fileNameInfo.innerText = "";
        validateAndToggleSubmit();

      } catch (error) {
        console.error(error);
        showStatus("❌ 데이터 처리에 실패했습니다.", "error");
        validateAndToggleSubmit();
      }
    };

    reader.onerror = () => {
      showStatus("❌ 파일을 읽는 데 실패했습니다.", "error");
      validateAndToggleSubmit();
    };

    reader.readAsArrayBuffer(selectedFile);
  });

  function showStatus(msg, type) {
    statusMsg.className = "status-msg " + type;
    statusMsg.innerText = msg;
  }
</script>
</body>
</html>
